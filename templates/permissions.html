<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GCP IAM Permissions - gcp-iam-catalog</title>
    <script>
(() => {
  if (window.__uvyThemeInitialized) return;
  window.__uvyThemeInitialized = true;
  const root = document.documentElement;
  const selector = '[data-uvy-theme-toggle], #theme-toggle';
  const system = matchMedia('(prefers-color-scheme: dark)');
  let preference = null;
  try {
    const cookie = document.cookie.split('; ').find(value => value.startsWith('uvy-theme='));
    const saved = cookie?.slice('uvy-theme='.length);
    if (saved === 'light' || saved === 'dark') preference = saved;
  } catch {}
  const sync = () => {
    const dark = preference ? preference === 'dark' : system.matches;
    root.dataset.theme = dark ? 'dark' : 'light';
    root.style.colorScheme = dark ? 'dark' : 'light';
    document.querySelectorAll(selector).forEach(button => {
      button.hidden = false;
      button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      button.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    });
  };
  sync();
  system.addEventListener('change', () => { if (!preference) sync(); });
  document.addEventListener('click', event => {
    if (!(event.target instanceof Element) || !event.target.closest(selector)) return;
    preference = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try {
      document.cookie = `uvy-theme=${preference}; Path=/; Max-Age=31536000; SameSite=Lax${location.protocol === 'https:' ? '; Secure' : ''}`;
    } catch {}
    sync();
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync, { once: true });
  else sync();
})();
    </script>
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and search all GCP IAM permissions. Find which roles grant each permission.">
    <script>
        function filterList() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase();
            const rows = document.querySelectorAll('.role-table .role-row');

            rows.forEach(row => {
                const link = row.querySelector('a');
                const name = (link ? (link.textContent || link.innerText) : '').toLowerCase();
                const title = (row.getAttribute('data-title') || '').toLowerCase();
                if (name.includes(filter) || title.includes(filter)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar" aria-label="Main">
        <a href="index.html">gcp-iam-catalog</a>
        <a href="roles.html">Roles</a>
        <a href="permissions.html" class="active">Permissions</a>
        <a href="search.html">Search</a>
        <button class="uvy-theme-toggle" data-uvy-theme-toggle type="button" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon"><svg class="uvy-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15A8 8 0 0 1 9 5a8 8 0 1 0 10 10Z"/></svg></span><span class="uvy-theme-light-icon"><svg class="uvy-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg></span></button>
    </nav>

    <main>
        <section class="permissions permissions-page">
            <div class="page-header">
                <span class="page-header-icon"><svg class="uvy-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="4"/><path d="m11 12 9 9m-3-3 2-2m-5-1 2-2"/></svg></span>
                <h1>GCP IAM Permissions</h1>
            </div>
            <p class="muted-text">Browse all GCP IAM permissions. Click on a permission to see which roles grant it and compare with other permissions.</p>
            <div class="search-container">
                <input type="text" id="searchInput" aria-label="Search displayed records" oninput="filterList()" placeholder="Search for permissions...">
                <span class="search-icon"><svg class="uvy-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></span>
            </div>
            <div class="role-table">
                {{range .Items}}
                    <div class="role-row" data-title="{{.Permission}}">
                        <div class="role-name-cell">
                            <span class="permission-indicator"></span>
                            <a href="permissions/{{.Permission}}.html" class="permission-name">{{.Permission}}</a>
                        </div>
                    </div>
                {{end}}
            </div>
        </section>
    </main>

    {{template "footer" .}}
</body>
</html>
