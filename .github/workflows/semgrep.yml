name: Semgrep

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b # v1.172.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        run: semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Remove suppressed findings
        id: filter
        uses: UnitVectorY-Labs/sarif-filter-suppressed@7df70341a6662d39039bc82045ea743cafe37a55 # v0.1.0
        with:
          input: semgrep.sarif
          output: semgrep.filtered.sarif

      - name: Upload findings to GitHub
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ steps.filter.outputs.output }}
          category: semgrep
