# .github/workflows/govulncheck-go.yml
name: Go Vulnerability Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

jobs:
  govulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1' # GOVERSION

      - name: Install dependencies
        run: go mod download

      - name: Build the application
        run: go build -v ./...

      - name: Scan Go vulnerabilities
        id: scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: '1.27.1' # GOVERSION
          check-latest: false
          cache: true
          work-dir: .
          go-package: ./...
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Deduplicate SARIF stacks
        # Work around https://github.com/golang/go/issues/81953.
        # SARIF requires unique stacks within each result.
        run: |
          jq '(.runs[].results[] | select(has("stacks")) | .stacks) |= unique' \
            govulncheck.sarif > govulncheck-normalized.sarif
          mv govulncheck-normalized.sarif govulncheck.sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
          wait-for-processing: true

      - name: Preserve SARIF report
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: govulncheck-sarif
          path: govulncheck.sarif
          if-no-files-found: error
          retention-days: 30
