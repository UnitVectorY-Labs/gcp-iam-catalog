# .github/workflows/osv-scanner.yml
name: OSV-Scanner

on:
  pull_request:
    branches: [ 'main' ]
  merge_group:
    branches: [ 'main' ]
    types: [ checks_requested ]
  push:
    branches: [ 'main' ]
  schedule:
    - cron: '23 9 * * 0' # Sunday at 09:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    name: Scan pull request dependencies
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
      upload-sarif: true
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./

  scan-full:
    name: Scan all dependencies
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: false
      upload-sarif: true
      scan-args: |-
        --recursive
        --allow-no-lockfiles
        ./
