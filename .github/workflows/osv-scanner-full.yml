name: OSV-Scanner Full Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-full:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Initial rollout reports vulnerabilities without failing the scan.
      fail-on-vuln: false
      upload-sarif: true
