name: OSV-Scanner Full Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-full:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Initial rollout reports vulnerabilities without failing the scan.
      fail-on-vuln: false
      upload-sarif: true
